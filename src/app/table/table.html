<table cdk-table [dataSource]="data()">
  <ng-container *ngFor="let column of columns()" [cdkColumnDef]="column.field">
    <th cdk-header-cell *cdkHeaderCellDef>{{ column.label }}</th>
    <td cdk-cell *cdkCellDef="let row">
      <ng-template appTableCellHost></ng-template>
    </td>
  </ng-container>

  <tr cdk-header-row *cdkHeaderRowDef="displayedColumns()"></tr>
  <tr cdk-row *cdkRowDef="let row; columns: displayedColumns()" appTableRowHost [row]="row" [columns]="columns()"></tr>
</table>
