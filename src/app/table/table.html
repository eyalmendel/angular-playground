<table>
    <thead>
        <tr>
             @if (tableSelectionService.selectable) {
                <th>
                    <input 
                        type="checkbox" 
                        [checked]="tableSelectionService.isAllRowsSelected()"
                        [indeterminate]="tableSelectionService.isIndeterminate()" 
                        (click)="tableSelectionService.toggleAllRowsSelection()">
                </th>
            }
            @for (column of columns(); track column.field) {
                <th 
                    (click)="column.sortable && setSortState(column.field)">
                    {{ column.label }}
                </th>
            }
        </tr>
    </thead>
    <tbody>
        <ng-container *appTableBody="let row of sortedData(); columns: columns()">
            <tr (click)="tableSelectionService.toggleRowSelection(row)">
                @if (tableSelectionService.selectable) {
                    <td>
                        <input  
                            type="checkbox" 
                            [checked]="tableSelectionService.isRowSelected(row)">
                    </td>
                }
                @for (column of columns(); track column.field) {
                    <td>
                        <ng-container 
                            appTableCellHost 
                            [row]="row" 
                            [column]="column">
                        </ng-container>
                    </td>
                }
            </tr>
        </ng-container>
    </tbody>
</table>

@if (selectable()) {
    <span class="selected-count">Selected: {{ tableSelectionService.selectedCount() }}</span>
}
