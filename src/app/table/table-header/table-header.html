<thead>
    @if (tableSelectionService.selectable) {
        <th>
            <input 
                type="checkbox" 
                [checked]="tableSelectionService.isAllRowsSelected()"
                [indeterminate]="tableSelectionService.isIndeterminate()" 
                (click)="tableSelectionService.toggleAllRowsSelection()">
        </th>
    }
    <tr>
        @for (column of columns(); track column.field) {
            <th>{{ column.label }}</th>
        }
    </tr>
</thead>
